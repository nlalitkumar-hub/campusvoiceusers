<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusVoice - Welcome Back</title>
<!-- Tailwind CSS with Forms and Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary": "#7d3d00",
              "surface-container-lowest": "#ffffff",
              "on-surface": "#191c1d",
              "surface-tint": "#732ee4",
              "on-primary": "#ffffff",
              "primary-fixed": "#eaddff",
              "on-secondary-container": "#fffbff",
              "on-background": "#191c1d",
              "outline": "#7b7487",
              "surface": "#f8f9fa",
              "primary": "#630ed4",
              "surface-dim": "#d9dadb",
              "tertiary-fixed-dim": "#ffb784",
              "secondary-fixed": "#f0dbff",
              "on-tertiary-fixed-variant": "#713700",
              "on-primary-fixed-variant": "#5a00c6",
              "on-primary-container": "#ede0ff",
              "on-primary-fixed": "#25005a",
              "outline-variant": "#ccc3d8",
              "on-secondary-fixed": "#2c0051",
              "inverse-on-surface": "#f0f1f2",
              "surface-container": "#edeeef",
              "on-tertiary": "#ffffff",
              "on-surface-variant": "#4a4455",
              "inverse-primary": "#d2bbff",
              "surface-container-low": "#f3f4f5",
              "tertiary-fixed": "#ffdcc6",
              "inverse-surface": "#2e3132",
              "tertiary-container": "#a15100",
              "secondary-container": "#9c48ea",
              "secondary": "#8127cf",
              "on-error": "#ffffff",
              "surface-variant": "#e1e3e4",
              "surface-bright": "#f8f9fa",
              "background": "#f8f9fa",
              "on-secondary-fixed-variant": "#6900b3",
              "error-container": "#ffdad6",
              "primary-fixed-dim": "#d2bbff",
              "surface-container-highest": "#e1e3e4",
              "on-error-container": "#93000a",
              "surface-container-high": "#e7e8e9",
              "on-tertiary-container": "#ffe0cd",
              "on-tertiary-fixed": "#301400",
              "secondary-fixed-dim": "#ddb7ff",
              "primary-container": "#7c3aed",
              "error": "#ba1a1a",
              "on-secondary": "#ffffff"
            },
            fontFamily: {
              "headline": ["Inter", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "2xl": "1.5rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }
      .bg-image-overlay {
        background: linear-gradient(to bottom, rgba(25, 28, 29, 0.2), rgba(25, 28, 29, 0.6));
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-body bg-background text-on-background antialiased overflow-hidden">
<!-- Full Screen Background Image Section -->
<div class="fixed inset-0 z-0">
<img class="w-full h-full object-cover" data-alt="Entrance of VIT University Chennai Campus with modern architectural gate and a prominent stone pillar under a clear blue sky." src="https://lh3.googleusercontent.com/aida/ADBb0uhzWTQUd3mrP9CKPy47Gw7pRVGEBDx1oaS8kVGD8HPBmS3Z9EdZccrVyxYDXkCEtk0k1KMZdOrAmWXzX0wkgwVVlFYDYbtnn8zI0exP524iJJsN51Sai8rLDzMVWw4-JR-JMTGXZEkiOcC76sMNYLbIlKCTIxyWdEp4RrAL6RABXuuE8ay1_eV-wNQx6P-gJzrex57QFbrjwQA3G582Mfth4hPzMRrwzcQlvHpuDXpbrJPSXrwjsOmPYmUJUopz9q9JbNmLuPBW0w"/>
<div class="absolute inset-0 bg-image-overlay"></div>
</div>
<!-- Main Login Container -->
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-6 py-12">
<!-- Branding Anchor (Top) -->
<div class="absolute top-12 flex flex-col items-center">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary-container text-4xl" data-icon="account_balance">account_balance</span>
</div>
<h1 class="text-white text-2xl font-extrabold tracking-tighter italic">CampusVoice</h1>
</div>
<!-- Login Glassmorphism Card -->
<div class="glass-card w-full max-w-sm rounded-2xl p-8 shadow-[0_24px_48px_rgba(0,0,0,0.15)] border border-white/40">
<!-- Content Header -->
<div class="mb-10 text-center">
<h2 class="text-on-surface font-headline text-2xl font-bold tracking-tight mb-2">Welcome Back!</h2>
<p class="text-on-surface-variant text-body-md leading-relaxed">
          Sign in to continue your scholarly advocacy and community updates.
        </p>
</div>
<!-- Login Form -->
<form class="space-y-6" onsubmit="return false;">
<!-- Input Field -->
<div class="space-y-2">
<label class="block text-label-md font-bold uppercase tracking-widest text-on-surface-variant px-1" for="email">
            Email Address
          </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
</div>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-primary/30 focus:bg-surface-container-lowest transition-all text-on-surface placeholder:text-on-surface-variant/50" id="email" placeholder="name@university.edu" type="email"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold py-4 rounded-xl shadow-[0_8px_16px_rgba(99,14,212,0.2)] hover:shadow-[0_12px_24px_rgba(99,14,212,0.3)] active:scale-[0.98] transition-all duration-200" type="submit">
          Continue
        </button>
</form>
<!-- Footer Links -->
<div class="mt-10 text-center">
<p class="text-on-surface-variant text-sm">
          Don't have an account? 
          <a class="text-primary font-semibold hover:text-primary-container transition-colors ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
<!-- Accessibility / Utility Footer -->
<div class="absolute bottom-8 w-full text-center px-6">
<div class="flex justify-center gap-6 text-[10px] font-medium uppercase tracking-[0.2em] text-white/70">
<a class="hover:text-white transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-white transition-colors" href="#">Terms of Service</a>
<a class="hover:text-white transition-colors" href="#">Help</a>
</div>
</div>
</main>
<!-- Shell components (Suppressed per instructions for Transactional Login Screen) -->
<!-- No BottomNavBar or TopAppBar is rendered here to prioritize focus on the login action -->
</body></html>
