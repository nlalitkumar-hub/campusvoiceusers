<div class="absolute inset-0 bg-gradient-to-b from-primary/20 via-transparent to-on-surface/40"></div>
</div>

<section class="relative z-10 w-full max-w-md bg-white/80 backdrop-blur-xl rounded-2xl p-8 md:p-10 shadow-[0_20px_50px_rgba(0,0,0,0.1)] border border-white/40 flex flex-col items-center">

<div class="mb-8 p-4 bg-primary/10 rounded-full">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="mark_email_read">mark_email_read</span>
</div>
<!-- Content Header -->
<header class="text-center mb-10">
<h1 class="text-3xl font-bold font-headline tracking-tight text-on-surface mb-3">Verify Your Email</h1>
<p class="text-on-surface-variant body-md leading-relaxed px-4">
                    We've sent a 6-digit code to your email. Please enter it below to proceed.
                </p>
</header>
<!-- OTP Input Form -->
<form class="w-full space-y-10">
<div class="flex justify-between gap-3 md:gap-4">
<!-- OTP Input Boxes -->
<input class="w-full aspect-square text-center text-2xl font-bold bg-surface-container-highest rounded-xl border-2 border-transparent focus:border-primary focus:bg-white focus:ring-0 transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-full aspect-square text-center text-2xl font-bold bg-surface-container-highest rounded-xl border-2 border-transparent focus:border-primary focus:bg-white focus:ring-0 transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-full aspect-square text-center text-2xl font-bold bg-surface-container-highest rounded-xl border-2 border-transparent focus:border-primary focus:bg-white focus:ring-0 transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-full aspect-square text-center text-2xl font-bold bg-surface-container-highest rounded-xl border-2 border-transparent focus:border-primary focus:bg-white focus:ring-0 transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-full aspect-square text-center text-2xl font-bold bg-surface-container-highest rounded-xl border-2 border-transparent focus:border-primary focus:bg-white focus:ring-0 transition-all outline-none" maxlength="1" placeholder="·" type="text"/>

</div>

                    Verify &amp; Login
                    <span class="material-symbols-outlined text-xl" data-icon="login">login</span>
</button>
</form>
<!-- Footer Links -->
<footer class="mt-8 text-center">
<p class="text-on-surface-variant text-sm mb-2">Didn't receive the code?</p>
<button class="text-primary font-semibold hover:text-primary-container transition-colors inline-flex items-center gap-1 group">
                    Resend Code
                    <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
<!-- Branding Anchor (Subtle) -->
<div class="mt-12 flex items-center gap-2 opacity-40">
<span class="material-symbols-outlined text-lg" data-icon="account_balance">account_balance</span>
<span class="text-xs font-bold tracking-widest uppercase italic">CampusVoice</span>
</div>

<!-- Aesthetic Floating Accent -->
<div class="absolute bottom-10 left-10 hidden md:block z-20">
<div class="text-white/60 text-xs font-label tracking-[0.2em] uppercase vertical-text">
