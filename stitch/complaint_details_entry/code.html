<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusVoice - Lodge Complaint</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-fixed": "#ffdcc6",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#7d3d00",
                        "inverse-primary": "#d2bbff",
                        "primary-fixed": "#eaddff",
                        "on-tertiary-fixed": "#301400",
                        "on-primary-container": "#ede0ff",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#9c48ea",
                        "background": "#f8f9fa",
                        "on-error": "#ffffff",
                        "surface": "#f8f9fa",
                        "outline-variant": "#ccc3d8",
                        "on-secondary-container": "#fffbff",
                        "inverse-surface": "#2e3132",
                        "surface-container-low": "#f3f4f5",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e7e8e9",
                        "primary-fixed-dim": "#d2bbff",
                        "on-secondary-fixed-variant": "#6900b3",
                        "secondary-fixed-dim": "#ddb7ff",
                        "error-container": "#ffdad6",
                        "outline": "#7b7487",
                        "tertiary-fixed-dim": "#ffb784",
                        "primary-container": "#7c3aed",
                        "surface-variant": "#e1e3e4",
                        "on-surface": "#191c1d",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#2c0051",
                        "on-surface-variant": "#4a4455",
                        "surface-tint": "#732ee4",
                        "surface-bright": "#f8f9fa",
                        "on-secondary": "#ffffff",
                        "on-background": "#191c1d",
                        "primary": "#630ed4",
                        "surface-dim": "#d9dadb",
                        "surface-container": "#edeeef",
                        "on-primary-fixed-variant": "#5a00c6",
                        "secondary-fixed": "#f0dbff",
                        "tertiary-container": "#a15100",
                        "surface-container-highest": "#e1e3e4",
                        "on-tertiary-container": "#ffe0cd",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f0f1f2",
                        "on-tertiary-fixed-variant": "#713700",
                        "secondary": "#8127cf",
                        "on-primary-fixed": "#25005a"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 flex items-center justify-between px-4 h-16 w-full bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 font-inter antialiased">
<div class="flex items-center gap-4">
<button class="p-2 text-violet-600 dark:text-violet-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors active:scale-95 duration-150 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-xl font-bold text-gray-900 dark:text-white">Lodge Complaint</h1>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-1 overflow-y-auto px-4 py-6 pb-32 max-w-2xl mx-auto w-full">
<!-- Progress Steps -->
<div class="flex items-center justify-between mb-8 px-2">
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center text-sm font-bold shadow-sm">1</div>
<span class="text-[10px] font-medium text-on-surface-variant">Photo</span>
</div>
<div class="flex-1 h-[2px] bg-primary-container mx-2 mb-6"></div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center text-sm font-bold shadow-md ring-4 ring-primary-fixed">2</div>
<span class="text-[10px] font-bold text-primary">Details</span>
</div>
<div class="flex-1 h-[2px] bg-surface-container-highest mx-2 mb-6"></div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center text-sm font-bold">3</div>
<span class="text-[10px] font-medium text-on-surface-variant">Review</span>
</div>
</div>
<form class="space-y-6">
<!-- Complaint Title -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Complaint Title *</label>
<div class="relative group">
<input class="w-full h-14 px-4 bg-white border-none ring-1 ring-outline-variant focus:ring-2 focus:ring-primary rounded-2xl transition-all outline-none text-on-surface placeholder:text-outline shadow-sm" placeholder="e.g., Water leakage in Block B" type="text"/>
</div>
</div>
<!-- Category Grid -->
<div class="space-y-3">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Category *</label>
<div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
<button class="flex items-center justify-center py-3 px-2 rounded-2xl bg-primary text-on-primary ring-1 ring-primary font-medium text-sm transition-all shadow-md" type="button">
                        Infrastructure
                    </button>
<button class="flex items-center justify-center py-3 px-2 rounded-2xl bg-white text-on-surface-variant ring-1 ring-outline-variant font-medium text-sm hover:bg-surface-container transition-all" type="button">
                        Technology
                    </button>
<button class="flex items-center justify-center py-3 px-2 rounded-2xl bg-white text-on-surface-variant ring-1 ring-outline-variant font-medium text-sm hover:bg-surface-container transition-all" type="button">
                        Hygiene
                    </button>
<button class="flex items-center justify-center py-3 px-2 rounded-2xl bg-white text-on-surface-variant ring-1 ring-outline-variant font-medium text-sm hover:bg-surface-container transition-all" type="button">
                        Safety
                    </button>
<button class="flex items-center justify-center py-3 px-2 rounded-2xl bg-white text-on-surface-variant ring-1 ring-outline-variant font-medium text-sm hover:bg-surface-container transition-all" type="button">
                        Health
                    </button>
<button class="flex items-center justify-center py-3 px-2 rounded-2xl bg-white text-on-surface-variant ring-1 ring-outline-variant font-medium text-sm hover:bg-surface-container transition-all" type="button">
                        Academic
                    </button>
<button class="flex items-center justify-center py-3 px-2 rounded-2xl bg-white text-on-surface-variant ring-1 ring-outline-variant font-medium text-sm hover:bg-surface-container transition-all col-span-full" type="button">
                        Other
                    </button>
</div>
</div>
<!-- Location -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Location *</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-primary" data-icon="location_on">location_on</span>
<input class="w-full h-14 pl-12 pr-4 bg-white border-none ring-1 ring-outline-variant focus:ring-2 focus:ring-primary rounded-2xl transition-all outline-none text-on-surface placeholder:text-outline shadow-sm" placeholder="e.g., Ground Floor, Near Room 102" type="text"/>
</div>
</div>
<!-- Description -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="block text-sm font-semibold text-on-surface-variant">Description *</label>
<span class="text-[11px] font-medium text-outline">0/500</span>
</div>
<textarea class="w-full p-4 bg-white border-none ring-1 ring-outline-variant focus:ring-2 focus:ring-primary rounded-2xl transition-all outline-none text-on-surface placeholder:text-outline shadow-sm resize-none" placeholder="Describe the issue in detail..." rows="5"></textarea>
</div>
<!-- Captured Photo Preview (Contextual Addition) -->
<div class="p-4 bg-white rounded-2xl shadow-sm ring-1 ring-outline-variant">
<div class="flex items-center gap-3">
<div class="w-16 h-16 rounded-xl overflow-hidden bg-surface-container flex-shrink-0">
<img alt="Photo preview" class="w-full h-full object-cover" data-alt="a close up high quality photograph of a cracked tile on a floor with dusty surroundings" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCI7niZjqnyPw3mEQud6v9Ftf2j1cQpUS3GcdK0UDM38xDgWg5D_pYKrQOLy4Y4HtKIArXxPkXhLn6NRDrCClkh1n8MEoDoqokzJ2K9181wHloSxv--IJloF94QOeVYpVIlH_n_3xxeYuKVMF072B7UBT8oiwFNBkpKaOXzVfA7be4yzjn6BNaIHM1C0OcvA3DIAqZm_gd4qIPwwuKGY9sJ5R6Mi3y69eZYlXcrk4HqDKrEeS-hmgd62LU5O1q7Dch-XD4Sa4Ykvgnj"/>
</div>
<div class="flex-1">
<p class="text-xs font-bold text-on-surface">Reference Photo</p>
<p class="text-[11px] text-on-surface-variant">Captured 2 minutes ago</p>
</div>
<button class="p-2 text-error hover:bg-error-container/50 rounded-xl transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
</div>
</form>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-white/80 backdrop-blur-md border-t border-outline-variant/30 flex flex-col gap-3">
<button class="w-full h-14 bg-primary text-on-primary rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-primary/20 hover:bg-secondary transition-all active:scale-[0.98]">
            Verify with AI
            <span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Hidden Bottom Nav for top-level pages (Suppressed here as per Destination Rule for focused journey) -->
<div class="hidden">
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 bg-white border-t border-gray-200">
<div class="flex flex-col items-center text-gray-500">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[11px]">Home</span>
</div>
<div class="flex flex-col items-center text-gray-500">
<span class="material-symbols-outlined" data-icon="chat_bubble">chat_bubble</span>
<span class="text-[11px]">My Feed</span>
</div>
<div class="flex flex-col items-center bg-violet-50 text-violet-700 rounded-xl px-3 py-1">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
<span class="text-[11px]">New</span>
</div>
<div class="flex flex-col items-center text-gray-500">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-[11px]">Profile</span>
</div>
</nav>
</div>
</body></html>
